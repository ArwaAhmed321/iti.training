<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="card-container">
        <article class="profile-card">
            
            <img src="img/porfile.jpg" alt="Profile Picture" class="profile-img">
            
            <h2 class="profile-name">Arwa Ahmed</h2>
            <p class="job-title">Frontend Developer</p>
            <p class="description">
                Passionate web developer specializing in creating responsive and modern user
                 interfaces with smooth user experiences.
            </p>
            
            <a href="#" class="contact-btn">Contact Me</a>
        </article>
    </main>

</body>
</html>
